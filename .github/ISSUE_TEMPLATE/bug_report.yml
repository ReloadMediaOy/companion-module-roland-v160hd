name: Bug report
description: Report a problem with the Roland V-160HD module.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Please report one problem per issue and check existing issues first. If you found the same problem, add your details to that issue.
        Reports are public. Remove passwords and other sensitive information from screenshots and logs.
  - type: input
    id: module-version
    attributes:
      label: Module version
      description: The version selected for your Roland V-160HD connection.
      placeholder: 'e.g. 2.5.1-beta.1'
    validations:
      required: true
  - type: input
    id: companion-version
    attributes:
      label: Companion version
      placeholder: 'e.g. 5.0.5 (include the build number if available)'
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: The operating system and version of the computer running Companion.
      placeholder: 'e.g. Windows 11, macOS 15, or Raspberry Pi OS'
    validations:
      required: true
  - type: input
    id: firmware-version
    attributes:
      label: Roland V-160HD firmware version
      description: Enter Unknown if you cannot check it, or Emulator if no real switcher was used.
      placeholder: 'Firmware version'
    validations:
      required: true
  - type: textarea
    id: actual-result
    attributes:
      label: What happened?
      description: Describe the problem, including any error message and whether it happens every time.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the actions, presets or settings involved. If you cannot reproduce it reliably, describe what you were doing.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs or other context (optional)
      description: Attach a screenshot or a short relevant log excerpt. Remove passwords and other sensitive information before posting.
